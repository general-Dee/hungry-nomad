name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder values only — not real secrets. These exist so modules
      # that construct a Supabase client at import time (src/lib/supabaseClient.ts,
      # src/lib/supabaseAdmin.ts) don't throw during `next build`'s page-data
      # collection. Every other integration (Paystack, Resend, Upstash Redis,
      # Sentry, analytics) degrades gracefully or is only read at request time,
      # so no placeholders are needed for those.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
